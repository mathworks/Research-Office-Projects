<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 140" font-family="Segoe UI, Arial, sans-serif">
  <!-- Input box -->
  <rect x="10" y="15" width="200" height="110" fill="white" stroke="#555" stroke-width="2" rx="6"/>
  <!-- Paper icon -->
  <path d="M20,30 L20,55 L38,55 L38,38 L32,30 Z" fill="none" stroke="#555" stroke-width="1.3"/>
  <path d="M32,30 L32,38 L38,38" fill="none" stroke="#555" stroke-width="1.3"/>
  <line x1="23" y1="38" x2="34" y2="38" stroke="#999" stroke-width="0.8"/>
  <line x1="23" y1="42" x2="34" y2="42" stroke="#999" stroke-width="0.8"/>
  <line x1="23" y1="46" x2="30" y2="46" stroke="#999" stroke-width="0.8"/>
  <!-- Image icon -->
  <rect x="43" y="32" width="20" height="15" fill="none" stroke="#555" stroke-width="1.3" rx="2"/>
  <circle cx="48" cy="37" r="2" fill="#999"/>
  <polyline points="43,45 49,39 54,43 59,40 63,45" fill="none" stroke="#999" stroke-width="1"/>
  <text x="137" y="44" text-anchor="middle" font-size="16" fill="#333">PDF / Images /</text>
  <text x="137" y="66" text-anchor="middle" font-size="16" fill="#333">Equations / Text</text>
  <!-- Separator -->
  <line x1="22" y1="80" x2="198" y2="80" stroke="#ddd" stroke-width="1"/>
  <!-- Video camera icon -->
  <rect x="22" y="93" width="26" height="18" fill="none" stroke="#555" stroke-width="1.3" rx="3"/>
  <polygon points="48,98 60,92 60,112 48,106" fill="none" stroke="#555" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="29" cy="99" r="2.2" fill="#d9363e"/>
  <text x="137" y="108" text-anchor="middle" font-size="16" fill="#333">Video / Webcam</text>

  <!-- Arrow 1 -->
  <line x1="218" y1="70" x2="248" y2="70" stroke="#555" stroke-width="3.5"/>
  <polygon points="248,63 262,70 248,77" fill="#555"/>

  <!-- xToSim box -->
  <rect x="268" y="35" width="130" height="70" fill="#e8740c" stroke="#c45e08" stroke-width="2" rx="6"/>
  <text x="333" y="76" text-anchor="middle" font-size="19" font-weight="bold" fill="white">xToSim</text>

  <!-- Arrow 2 -->
  <line x1="406" y1="70" x2="436" y2="70" stroke="#555" stroke-width="3.5"/>
  <polygon points="436,63 450,70 436,77" fill="#555"/>

  <!-- Output box -->
  <rect x="456" y="30" width="168" height="80" fill="white" stroke="#555" stroke-width="2" rx="6"/>
  <!-- Row 1: Simulink icon + text -->
  <rect x="466" y="43" width="20" height="12" fill="#cce5ff" stroke="#4a90d9" stroke-width="1" rx="2"/>
  <rect x="466" y="58" width="20" height="12" fill="#cce5ff" stroke="#4a90d9" stroke-width="1" rx="2"/>
  <line x1="486" y1="49" x2="491" y2="49" stroke="#333" stroke-width="1"/>
  <line x1="491" y1="49" x2="491" y2="64" stroke="#333" stroke-width="1"/>
  <line x1="486" y1="64" x2="491" y2="64" stroke="#333" stroke-width="1"/>
  <text x="499" y="59" font-size="16" fill="#333">Simulink Model</text>
  <!-- Row 2: Report icon + text -->
  <rect x="467" y="77" width="16" height="20" fill="none" stroke="#555" stroke-width="1.2" rx="1"/>
  <line x1="471" y1="83" x2="479" y2="83" stroke="#999" stroke-width="1"/>
  <line x1="471" y1="87" x2="479" y2="87" stroke="#999" stroke-width="1"/>
  <line x1="471" y1="91" x2="476" y2="91" stroke="#999" stroke-width="1"/>
  <text x="499" y="91" font-size="16" fill="#333">HTML Report</text>
</svg>
